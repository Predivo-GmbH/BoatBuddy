name: v11 Staging Gates

# Runs the v11 hardened audit gates (e2e/staging/) against the LIVE staging site:
#   Gate A  constrained-viewport reachability (off-screen-Save class)
#   Gate B/J commit-boundary + orphan-file residue (draft-in-memory + storage)
#   Gate I  correctness under real data volume (>1000-row PostgREST cap)
#   Gate K  fault-injected 500/empty loads render gracefully
#   Gate M  deployed-bundle identity - staging bundle talks to STAGING, never prod
# A red run here IS the alert (same model as the fleet grant-drift + auth-email guards).

on:
  workflow_run:
    workflows: ['Deploy'] # re-verify staging right after every deploy
    types: [completed]
  schedule:
    # DAILY 06:30 UTC (was weekly Mon). 2026-08-24: the Gate A runtime crawl moved off the
    # per-deploy path to this schedule. Measured over 320 gate runs fleet-wide, the crawl was
    # 71.4 percent of gate wall time (2202 of 3084 min) and here 7.8 min of a 9.8 min run, while
    # the file comment below still claimed ~1.2 min. Discovery of NEW dialog surfaces is a daily
    # concern; the assertions stay on every deploy.
    - cron: '30 6 * * *'
  workflow_dispatch: {}

concurrency:
  group: v11-staging-gates
  # NOT cancel-in-progress. This gate takes ~35 minutes and the group is a constant, so any
  # newer run killed the one in flight, often at minute 34. Measured 2026-08-24 across the
  # seven repos that run it: 40 of 133 recent runs ended `cancelled`, 30 percent, and
  # BackOffice had 1 success and 0 failures against 12 cancellations. A cancelled gate is
  # not a failing gate, so the dashboard looked clean while the gate was barely reporting.
  # With false, the running gate finishes; GitHub keeps at most one run pending, so a newer
  # commit still supersedes an older WAITING one without destroying a verdict in progress.
  cancel-in-progress: false

env:
  # Needed by npm ci: .npmrc points @predivo-gmbh at GitHub Packages.
  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

jobs:
  # ---------------------------------------------------------------------------------------
  # PER-DEPLOY: the v11 assertions only. No crawl, no seed. ~2 min instead of ~10.
  # The Gate A COVERAGE DENOMINATOR is excluded here and only here, because it reads
  # playwright/.gate-a/crawl-manifest.json which only the crawl writes. It is not weakened:
  # it still runs, in the `full` job below, in the same job as the crawl that feeds it, and it
  # still FAILS on a missing manifest (v11-gates.spec.ts asserts existsSync(...) is true).
  # Excluding it here rather than letting it read a stale manifest is the point: scoring a
  # previous run's crawl is the exact defect the ORDER MATTERS comment below was written for.
  # ---------------------------------------------------------------------------------------
  gates:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run v11 hardened gates against staging (coverage denominator runs in `full`)
        run: npx playwright test --config playwright.v11-gates.config.ts --grep-invert "coverage denominator"
        env:
          STAGING_HTPASSWD_USER: ${{ secrets.STAGING_HTPASSWD_USER }}
          STAGING_HTPASSWD_PASS: ${{ secrets.STAGING_HTPASSWD_PASS }}
          BB_MGMT_TOKEN: ${{ secrets.BB_MGMT_TOKEN }}
          BB_SVC_KEY: ${{ secrets.BB_SVC_KEY }}

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: v11-gates-report
          path: playwright-report/

  # ---------------------------------------------------------------------------------------
  # DAILY + MANUAL: seed -> crawl -> the FULL v11 suite including the coverage denominator.
  # Unchanged from what used to run after every deploy; only its cadence changed.
  # ---------------------------------------------------------------------------------------
  full:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 40  # v11 gates + the Gate A runtime crawl (measured 7.8 min/run, 2026-08-24)
    if: ${{ github.event_name != 'workflow_run' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # ORDER MATTERS. The crawl runs FIRST because the v11 coverage gate reads the manifest
      # it writes. With the gates first, that gate scored the PREVIOUS run's crawl, so a
      # surface fixed in this commit still read as uncovered, and a surface broken in this
      # commit still read as covered. Same defect ReplyFlow had on 2026-08-20.
      # Gate A runtime crawl (2026-08-20), the sixth and last product to get it. Gate A was
      # WRITTEN after this product shipped a dialog whose Save button sat below the fold and
      # a full audit passed it anyway; the B4 meta-audit then found the gate itself driving
      # 3 of 9 dialog-class surfaces here while the report published "Gate A: PASS".
      # This discovers dialogs by DRIVING the app at BOTH a desktop and a mobile width, so
      # nothing has to be remembered. First run: 8 routes x 2 widths, 2 dialogs, 2 of 2
      # controls, 0 findings. This product came back CLEAN, unlike the other five.
      # READ-ONLY: commit controls are measured, never clicked. The create/edit triggers ARE
      # driven on purpose because they were traced to source and are pure state setters that
      # open a dialog and write nothing; only destructive/off-site names are denied.
      # always(): a known-red earlier gate must not silently disable this layer.
      # Two of this product's nine dialog surfaces are per-row: GastsessionTabelle and
      # NutzungslogTabelle render their edit dialog only when a row exists. With both tables
      # empty on staging the crawl found no row-level trigger at all and could never open them,
      # which is why coverage sat at 7 of 9. This seeds one marked row in each, idempotently.
      - name: Seed the Gate A row fixtures
        if: always()
        run: node e2e/staging/seed-gate-a-fixtures.mjs
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}

      - name: Run Gate A runtime crawl against staging
        if: always()
        run: npx playwright test --config playwright.gate-a-crawl.config.ts
        env:
          STAGING_URL: https://staging.boatbuddy.predivo.ch
          STAGING_HTPASSWD_USER: ${{ secrets.STAGING_HTPASSWD_USER }}
          STAGING_HTPASSWD_PASS: ${{ secrets.STAGING_HTPASSWD_PASS }}

      - name: Run v11 hardened gates against staging
        run: npx playwright test --config playwright.v11-gates.config.ts
        env:
          STAGING_HTPASSWD_USER: ${{ secrets.STAGING_HTPASSWD_USER }}
          STAGING_HTPASSWD_PASS: ${{ secrets.STAGING_HTPASSWD_PASS }}
          BB_MGMT_TOKEN: ${{ secrets.BB_MGMT_TOKEN }}
          BB_SVC_KEY: ${{ secrets.BB_SVC_KEY }}

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: v11-gates-report
          path: playwright-report/
