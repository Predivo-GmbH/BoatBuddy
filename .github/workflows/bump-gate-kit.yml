name: Bump gate-kit

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact gate-kit version to propose (e.g. 0.8.0)'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  bump:
    # SR-SUP-08: public repository; GitHub-hosted only. Reviewed 2026-11-04.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Propose dependency changes on a branch/PR; never push directly to main.
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ inputs.version }}
      NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Validate the version and update only the lockfile before installation
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::Expected an exact stable version'; exit 1; }
          npm ci
          npm pkg set "devDependencies.@predivo-gmbh/gate-kit=$VERSION"
          npm update @predivo-gmbh/gate-kit --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci
          node --input-type=module -e 'import fs from "node:fs"; const p = JSON.parse(fs.readFileSync("node_modules/@predivo-gmbh/gate-kit/package.json")); if (p.version !== process.env.VERSION) throw new Error("Requested version was not installed")'
      - name: Open a dependency pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- package.json package-lock.json; then exit 0; fi
          branch="chore/gate-kit-$VERSION-$GITHUB_RUN_ID"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m "Update gate-kit to $VERSION"
          git push origin "$branch"
          printf '%s\n' 'Updates the exact gate-kit dependency and lockfile. No direct push to main.' '' 'This bot PR needs its normal checks before merge. GitHub does not trigger them from GITHUB_TOKEN-created PRs; a maintainer must close/reopen it or push a reviewed change.' > "$RUNNER_TEMP/pr-body.txt"
          gh pr create --base main --head "$branch" --title "Update gate-kit to $VERSION" --body-file "$RUNNER_TEMP/pr-body.txt"
