name: Main must come from a green pull request

on:
  push:
    branches: [main]
  workflow_call:

# Each pushed commit gets its own verdict, including documentation-only pushes.
concurrency:
  group: ${{ github.workflow }}-pr-guard-${{ github.sha }}-${{ github.run_id }}

permissions:
  contents: read

jobs:
  verify:
    # SR-SUP-08: public repository; GitHub-hosted only. Reviewed 2026-11-04.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Read merged PRs and their checks; never modify settings.
      pull-requests: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Require the exact merged PR and green checks before the merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-main-pr.mjs
