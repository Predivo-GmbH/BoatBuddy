# Keeps the unauthenticated /auth/v1/recover hole closed.
#
# The fix applied 2026-09-15 is a SUPABASE PROJECT SETTING (external_email_enabled: false), not
# code — so nothing in this repository would notice if it were switched back on. That is exactly
# the failure shape this file exists to prevent: a closed state that lives only in a dashboard
# goes quietly stale, and the first sign would be a stranger's inbox.
#
# scripts/signin-captcha.prod.test.mjs probes the live projects read-only, with a reserved,
# non-routable probe address, and exits 0 only while a tokenless /recover is refused — by EITHER
# valid mechanism (captcha, or the email provider being off), so switching to captcha later is
# not a regression. See docs/FIX-the-unauthenticated-recover-hole-2026-09-14.md.
name: Auth hole guard

on:
  schedule:
    # Daily, shortly after the keep-alive ping.
    - cron: '30 8 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/signin-captcha.prod.test.mjs'
      - '.github/workflows/auth-hole-guard.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recover-hole-is-closed:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # No `npm ci`: the guard uses node builtins and fetch only, deliberately, so it cannot be
      # taken down by a dependency problem on the one day it matters.
      - name: Probe both projects
        env:
          # The anon/publishable keys are PUBLIC — they ship in every visitor's browser. They are
          # passed here so the guard never has to reach for the management token in the normal
          # case; the token is the fallback for when a key is rotated and this list goes stale.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          STAGING_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/signin-captcha.prod.test.mjs
