name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Ping Supabase Production (real DB query via GraphQL)
        run: |
          echo "=== Production: GraphQL ping ==="
          gql_response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/graphql/v1" \
            -X POST \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ __typename }"}')
          echo "Production GraphQL response: $gql_response"

          echo "=== Production: Auth ping (backup) ==="
          auth_response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.SUPABASE_URL }}/auth/v1/token?grant_type=password" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"email":"keepalive@ping.local","password":"keepalive"}')
          echo "Production Auth response: $auth_response"

          if [ "$gql_response" = "000" ] && [ "$auth_response" = "000" ]; then
            echo "::error::Production Supabase project appears completely unreachable"
            exit 1
          fi

          if [ "$gql_response" != "200" ]; then
            echo "::error::Production GraphQL ping returned $gql_response — database may be paused"
            exit 1
          fi

          echo "Production Supabase project pinged successfully"

      - name: Ping Supabase Staging (real DB query via GraphQL)
        run: |
          echo "=== Staging: GraphQL ping ==="
          gql_response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.STAGING_SUPABASE_URL }}/graphql/v1" \
            -X POST \
            -H "apikey: ${{ secrets.STAGING_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.STAGING_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ __typename }"}')
          echo "Staging GraphQL response: $gql_response"

          echo "=== Staging: Auth ping (backup) ==="
          auth_response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.STAGING_SUPABASE_URL }}/auth/v1/token?grant_type=password" \
            -H "apikey: ${{ secrets.STAGING_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"email":"keepalive@ping.local","password":"keepalive"}')
          echo "Staging Auth response: $auth_response"

          if [ "$gql_response" = "000" ] && [ "$auth_response" = "000" ]; then
            echo "::error::Staging Supabase project appears completely unreachable"
            exit 1
          fi

          if [ "$gql_response" != "200" ]; then
            echo "::error::Staging GraphQL ping returned $gql_response — database may be paused"
            exit 1
          fi

          echo "Staging Supabase project pinged successfully"
