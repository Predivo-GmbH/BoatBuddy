name: Keep Supabase Alive

on:
  schedule:
    - cron: '35 8 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # REST OpenAPI needs no row read and works before AND after migration 033.
      # No GraphQL extension or sign-in request is needed.
      - name: Ping Supabase production and staging REST
        env:
          PRODUCTION_URL: ${{ secrets.SUPABASE_URL }}
          PRODUCTION_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          STAGING_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_KEY: ${{ secrets.STAGING_ANON_KEY }}
        run: |
          node --input-type=module <<'NODE'
          for (const environment of ['PRODUCTION', 'STAGING']) {
            const url = process.env[`${environment}_URL`]
            const key = process.env[`${environment}_KEY`]
            if (!url || !key) throw new Error(`${environment}: missing URL or public key`)
            try {
              const response = await fetch(`${url}/rest/v1/`, {
                headers: { apikey: key, Authorization: `Bearer ${key}` },
                redirect: 'error', signal: AbortSignal.timeout(30000),
              })
              await response.body?.cancel()
              console.log(`${environment}: REST HTTP ${response.status}`)
              if (!response.ok) process.exitCode = 1
            } catch {
              console.error(`${environment}: REST request failed`)
              process.exitCode = 1
            }
          }
          NODE
