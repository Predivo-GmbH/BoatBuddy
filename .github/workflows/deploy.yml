name: Deploy

# ─────────────────────────────────────────────────────────────────────────────
# TIERED PIPELINE (2026-07-15) — "gates guard prod, not every staging push".
#
# The old shape ran the FULL gauntlet (validate -> deploy-staging -> E2E) on
# EVERY push to main, so a one-line content change took ~15 min. Industry
# standard (DORA): deploy often, keep the per-push pipeline fast, and run the
# heavy acceptance suite as a RELEASE gate + nightly — not on every push.
#
#   push -> main        FAST staging deploy: lint + unit + build + FTP + edge
#                       fns + alive-smoke. ~5-6 min.  (job: deploy-staging)
#   schedule (nightly)  FULL gauntlet against live staging — daily regression
#                       signal even with no promotion.  (jobs: gate-*)
#   workflow_dispatch   PROD promotion. Gated behind the FULL gauntlet
#     confirm=deploy    (integration + E2E) THEN deploys prod.  (gate-* -> deploy)
#
# Nothing was weakened for PRODUCTION: prod still cannot ship unless the staging
# integration suite and the staging E2E suite are both green for the promoted
# commit. What changed is WHEN they run — release-time + nightly instead of on
# every trivial staging push.
# ─────────────────────────────────────────────────────────────────────────────

on:
  # Push to main runs the fast staging deploy ONLY. Production is NOT deployed
  # automatically — it requires an explicit manual run (workflow_dispatch) so we
  # always review the gates before going live ("ask before production").
  push:
    branches: [main]
    paths-ignore:
      # '*.md' matches ROOT-LEVEL markdown only in GitHub Actions, so a docs-only change
      # in any subfolder still triggered a full deploy. No markdown in this repo is a
      # build input (checked for `import ... .md`, `?raw` and import.meta.glob), so it
      # is safe to ignore markdown at any depth.
      - '*.md'
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  # NIGHTLY, AND IT IS NOT A REPEAT OF THE PUSH RUN. Removed 2026-09-12 on the stated ground
  # that push already covers it; measured 2026-09-13, push SKIPS gate-integration, gate-security
  # and gate-e2e (ChannelMover run 34719595752), so this cron is the only daily run of them. The
  # 2026-09-09 security advisory that blocked five products was caught by exactly this run.
  schedule:
    - cron: '35 4 * * *'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deployment (runs staging + E2E first)'
        required: true
        default: ''

concurrency:
  # Production promotions (workflow_dispatch) keep their own serialized, NEVER-cancelled
  # group: cancelling a mid-flight FTP mirror can leave prod half-uploaded.
  # Pushes (the staging pipeline) get a per-ref group that DOES cancel — when several
  # commits land in a row only the newest needs a staging deploy + E2E.
  group: ${{ github.event_name == 'workflow_dispatch' && 'deploy-production' || format('staging-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

# ===========================================================================
# NPM CACHE — deliberately absent. Do not add `cache: npm` back to setup-node.
#
# These jobs run on a persistent self-hosted runner, where ~/.npm is not a cache
# that a job populates and throws away: it is a directory holding every package
# this machine has ever installed, for every repo on it. On 2026-09-03 it stood at
# 1,811,836,788 bytes. setup-node's cache-save post-step uploads that whole tree
# whenever the key misses — which is precisely what a dependency-changing commit
# does — at ~1.5 MB/s, so it needs roughly twenty minutes and no job here is given
# that long. The job is killed at its timeout while every real step has already
# passed, and GitHub reports the job as `cancelled`. `deploy` needs those jobs, so
# it is skipped: a green pipeline that shipped nothing.
#
# Measured, not inferred — run 33718969126, job gate-integration (timeout-minutes: 10):
#   4. Run npm ci                  -> success   (18s)
#   5. Integration tests           -> success   (3s)
#   9. Post Run actions/setup-node -> cancelled (9m34s, "Sent 1006632960 of
#      1811836788 (55.6%), 1.7 MBs/sec", then "The operation was canceled.")
# The same post-step killed gate-e2e in run 33642219997 and both 10-minute gates in
# run 33640629837 — the three promotion attempts previously misread as sessions
# cancelling each other. They cannot: `cancel-in-progress` is false for
# workflow_dispatch (see above), so dispatched promotions queue, they never cancel.
#
# The cache also buys nothing here: npm ci already reads the host's ~/.npm directly.
# On GitHub-hosted runners (what clearing RUNNER_LABEL falls back to) it would be a
# small win, but npm ci for this project takes ~15s uncached, which is not worth a
# post-step that can silently skip the production deploy.
# ===========================================================================

env:
  # Needed by npm ci: .npmrc points @predivo-gmbh at GitHub Packages.
  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

jobs:
  # ===========================================================================
  # 1. FAST STAGING DEPLOY — every push. One job, one checkout, one npm ci,
  #    build once. lint + unit tests are the per-push gates (the test pyramid's
  #    fast base): a change that lints, typechecks (tsc in build), and passes
  #    unit tests cannot white-screen the site. The heavy integration / E2E
  #    suites run on the nightly + prod-promotion gauntlet below, NOT here.
  # ===========================================================================
  deploy-staging:
    # ---------------------------------------------------------------------------
    # SINGLE WRITER FOR THE ONE STAGING SITE (added 2026-09-09, board row
    # a-production-release-test-can-be-failed-by-an-unrelated).
    #
    # The workflow-level `concurrency:` above deliberately puts pushes and promotions in
    # DIFFERENT groups, and each half of that is right on its own: a mid-flight FTP mirror to
    # PRODUCTION must never be cancelled, and a burst of pushes only needs the newest staged.
    # Together they mean a promotion and a push can run AT THE SAME TIME on the same ref - and
    # then `deploy-staging` is FTP-mirroring new files over the staging site while the release
    # gates are driving a browser against exactly that site. A release test then fails on a
    # half-uploaded site with nothing wrong with the release at all. Measured on ReplyFlow
    # 2026-09-02: dispatch 33627614494 (12:00:54Z) overlapped push 33627544651 (12:00:13Z) on
    # the same commit; the health check passed against the OLD staging still up, then a page
    # navigation timed out on all three attempts inside the FTP replacement window. The same
    # gate had passed twice that day with no deploy in flight.
    #
    # This is a JOB-level group, not a change to the workflow-level one, and that is the point:
    # it serialises only the jobs that touch the staging site, so pushes still cancel each other
    # and promotions still refuse to be cancelled. cancel-in-progress MUST stay false -
    # cancelling either half is the failure this exists to prevent, not the remedy.
    #
    # Proven on ReplyFlow first; this is the same change on the rest of the fleet, which the
    # 2026-09-02 finding named explicitly as sharing the shape.
    # ---------------------------------------------------------------------------
    concurrency:
      group: staging-site-${{ github.ref }}
      cancel-in-progress: false
    if: github.event_name == 'push'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Verify FTP credentials (fail fast on a stale secret)
        # A stale FTP secret used to surface late and confusingly. The site-id guard
        # tests `[ -n "$REMOTE_ID" ]`, and a 530 leaves REMOTE_ID empty - so the guard
        # printed "guard passed (remote='')" at the exact moment auth broke, and the run
        # only failed later inside the mirror, after up to 4 retries. This logs in once,
        # up front, and names the failure. curl exit 67 == FTP login denied; curl needs
        # no lftp, so this can run before checkout. (Added 2026-08-23 after the whole
        # fleet's FTP_PASS went stale at once.)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          set +e
          # --insecure mirrors `set ssl:verify-certificate no`, which every lftp call in
          # this fleet already uses: the Metanet cert is issued for tertia.sui-inter.net,
          # not for the FTP_HOST value, so verification fails with curl exit 60. The
          # control channel is still TLS; only name verification is skipped.
          # One slow answer from a busy FTP server is not a bad password. Retry the
          # transport, never the credential: curl 67 ("Access denied: 530") is final,
          # because a wrong password does not become right on attempt two. Added after
          # 15 simultaneous fleet deploys made this step time out at 30s (curl 28).
          n=0
          while :; do
            OUT=$(curl -sS --ssl-reqd --insecure --connect-timeout 20 --max-time 90 --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/" 2>&1)
            RC=$?
            if [ "$RC" -eq 0 ] || [ "$RC" -eq 67 ]; then break; fi
            n=$((n+1))
            if [ "$n" -ge 3 ]; then break; fi
            echo "FTP pre-flight attempt $n failed (curl exit $RC) - retrying in $((n*10))s"
            sleep $((n*10))
          done
          set -e
          if [ "$RC" -eq 67 ]; then
            echo "::error::FTP login denied (530) for $FTP_USER@$FTP_HOST - the FTP password secret is stale. Nothing was deployed."
            exit 1
          fi
          if [ "$RC" -ne 0 ]; then
            echo "::error::FTP connection failed (curl exit $RC) for $FTP_USER@$FTP_HOST. Nothing was deployed."
            printf '%s\n' "$OUT" | head -5
            exit 1
          fi
          echo "FTP auth OK - $(printf '%s\n' "$OUT" | grep -c '') entries at the account root."

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
        # No `cache: npm` on this runner — see the "NPM CACHE" note in deploy.yml.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --run --passWithNoTests
        env:
          # `npm test` (vitest run) also picks up tests/integration/critical-paths.test.ts
          # (vitest.config excludes only e2e/**), which builds a Supabase client at beforeAll.
          # Since c7152aa6 dropped the hardcoded staging-anon fallback, the key must come from
          # the env here too or createClient() throws "supabaseKey is required."
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}

      - name: Build for staging
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}
          VITE_GATE_PASSWORD_HASH: ${{ secrets.VITE_GATE_PASSWORD_HASH }}

      # The FTP mirror below uploads ./dist/ wholesale. vite's publicDir is `public/`, so
      # docs/ (which holds the gitignored credentials file and its rotation backups) does
      # not reach dist today - but "does not today" is an observation, not a control. This
      # makes the upload REFUSE rather than merely happen to be safe.
      - name: Guard - nothing credential-shaped may reach the FTP upload
        run: node scripts/guard-credential-files.mjs --dir dist

      - name: Prepare staging .htaccess (real prod config + Basic auth + noindex)
        run: |
          # Start from the REAL production .htaccess (from the build) so staging catches
          # any Apache syntax error BEFORE it can reach production.
          mv dist/.htaccess /tmp/prod.htaccess
          {
            echo 'AuthType Basic'
            echo 'AuthName "Staging"'
            echo 'AuthUserFile /var/www/vhosts/predivo.ch/staging.boatbuddy.predivo.ch/.htpasswd'
            echo 'Require valid-user'
            echo ''
            cat /tmp/prod.htaccess
            echo ''
            echo '# --- Staging overrides: never index staging ---'
            echo '<IfModule mod_headers.c>'
            echo '  Header always set X-Robots-Tag "noindex, nofollow"'
            echo '</IfModule>'
          } > dist/.htaccess

      - name: Deploy staging via FTP
        # Zero-downtime, matching this repo's own production job. A single
        # `mirror --delete` uploads and deletes in ONE pass, so mid-mirror the new
        # index.html can be live while its hashed chunks are not yet uploaded and the old
        # ones are already gone: every chunk 404s and the page renders BLANK. Proven
        # 2026-08-23 in ReplyFlow run 32662317038 (index.html 200, five chunks 404, blank
        # screenshot) where it failed an E2E gate and read as a flaky test. Assets first
        # without --delete, so new chunks exist before anything references them.
        # The root mirror keeps --delete but EXCLUDES assets/: a browser tab still
        # running an OLD index.html fetches the OLD hashed chunks (lazily, on the next
        # navigation), and deleting them at deploy time turns that into "Failed to fetch
        # dynamically imported module". Old chunks are pruned by AGE (14 days) in the
        # step below — long after every open tab has either reloaded or gone away.
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          sudo apt-get install -y lftp
          echo "boatbuddy-staging" > ./dist/.site-id
          # Resilient FTPS for Metanet: force PASV, single data connection, retry loop.
          # Exclude .htpasswd so the mirror's --delete never removes the auth file.
          # Exclude '^assets/' so it never deletes superseded hashed chunks either.
          CMDS="set ftp:ssl-force yes; set ssl:verify-certificate no; set ftp:ssl-protect-data no; set ftp:passive-mode yes; set ftp:prefer-epsv no; set net:timeout 30; set net:max-retries 4; set net:persist-retries 4; set net:reconnect-interval-base 8; set mirror:parallel-transfer-count 4; mirror --reverse --no-perms --verbose ./dist/assets/ staging.boatbuddy.predivo.ch/assets/; mirror --reverse --delete --no-perms --verbose --exclude '^assets/' --exclude .htpasswd --exclude cgi-bin/ ./dist/ staging.boatbuddy.predivo.ch/; bye"
          n=0
          until [ $n -ge 4 ]; do
            if timeout 420 lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "$CMDS"; then
              echo "Staging FTP deploy succeeded (attempt $((n+1)))"; exit 0
            fi
            n=$((n + 1)); echo "::warning::Staging FTP attempt $n failed (transient FTPS data-channel failure — runner-side; Metanet FTP verified reachable); retrying in 25s..."; sleep 25
          done
          echo "::error::Staging FTP deploy failed after 4 attempts"; exit 1

      - name: Apply DB migrations to staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/apply-migrations.mjs --project-ref svpewgbwousyheohlrtt

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Deploy edge functions to staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Retry-with-backoff for transient Supabase API 502s.
          FNS=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d -not -name '_*' -printf '%f ')
          n=0
          until [ $n -ge 4 ]; do
            if supabase functions deploy $FNS --project-ref svpewgbwousyheohlrtt --use-api; then
              echo "Edge functions deployed to staging (attempt $((n+1)))"; exit 0
            fi
            n=$((n + 1)); echo "::warning::Supabase functions-deploy attempt $n failed (transient API error, e.g. 502); backing off 60s..."; sleep 60
          done
          echo "::error::Edge functions deploy to staging failed after 4 attempts"; exit 1

      - name: Verify staging is alive (catches .htaccess errors)
        run: |
          # Retry loop survives transient curl failures (exit 23 etc.), not just non-200s.
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u "${{ secrets.STAGING_HTPASSWD_USER }}:${{ secrets.STAGING_HTPASSWD_PASS }}" https://staging.boatbuddy.predivo.ch --max-time 30 || echo 000)
            if [ "$STATUS" = "200" ]; then echo "Staging health check passed (HTTP $STATUS, attempt $i)"; exit 0; fi
            echo "::warning::Staging check attempt $i/6 got HTTP $STATUS - retrying in 15s..."
            sleep 15
          done
          echo "::error::Staging returned HTTP $STATUS after 6 attempts - likely .htaccess error. Blocking production deploy."
          exit 1

      - name: Prune stale assets (14-day retention)
        # Age-based cleanup of the hashed chunks the asset-retention exclusion above
        # leaves behind. lftp has no find -mtime (only -max-depth/-ls — verified against
        # the 4.8.1 man page), so this probes each file's mtime over raw FTP MDTM
        # (RFC 3659) and deletes files older than 14 days. 14 days ≫ any realistically
        # open tab, so stale-tab chunk fetches 404 only for sessions older than the
        # retention window.
        #
        # Never fails the deploy: a cleanup hiccup must not block promotion-relevant
        # runs; it logs ::error:: (red annotation, run still green) and the next deploy
        # retries. Capped at 1000 deletions per run so a logic bug cannot mass-delete
        # and a long outage self-heals progressively over successive deploys.
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          ASSETS_DIR: staging.boatbuddy.predivo.ch/assets
        run: |
          # GitHub wraps every run block in bash -e: a failing command substitution in an
          # assignment (e.g. LIST=$(lftp ...)) would abort the whole step BEFORE the script's
          # own rc guards run. Cleanup must never abort mid-run — disable -e first.
          set +e
          set -u
          export TZ=UTC
          DAYS=14
          CUTOFF=$(date -u -d "$DAYS days ago" +%Y%m%d%H%M%S)
          SETTINGS="set ftp:ssl-force yes
          set ssl:verify-certificate no; set ftp:ssl-protect-data no
          set ftp:passive-mode yes; set net:timeout 60"

          LIST=$(timeout 180 lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<SCRIPT 2>&1
          $SETTINGS
          find $ASSETS_DIR
          quit
          SCRIPT
          )
          if [ $? -ne 0 ]; then
            echo "::error::Asset prune: listing $ASSETS_DIR failed - leaving cleanup to the next deploy. Output: $(echo "$LIST" | head -3)"
            exit 0
          fi
          if [ -z "$(echo "$LIST" | tr -d '[:space:]')" ]; then
            echo "Asset prune: $ASSETS_DIR is empty - nothing to do."
            exit 0
          fi

          # Probe every file's mtime in ONE lftp session: echo a PROBE: name line before
          # each quote MDTM so reply lines stay paired with their file even when a file
          # vanishes (550) between listing and probing.
          PROBE_SCRIPT=$(mktemp)
          {
            echo "open -u $FTP_USER,$FTP_PASS ftp://$FTP_HOST"
            echo "$SETTINGS"
            # find prints full remote paths ("$ASSETS_DIR/<nested>/file", recursively);
            # normalize to a path relative to ASSETS_DIR so either output format is safe.
            echo "$LIST" | while IFS= read -r p; do
              p="${p%$'\r'}"
              [ "$p" = "$ASSETS_DIR" ] && continue
              rel="${p#"$ASSETS_DIR"/}"
              # Hashed asset names only ([A-Za-z0-9._/-], no spaces/globs) — anything
              # else is skipped, never deleted.
              [[ "$rel" =~ ^[A-Za-z0-9._/-]+$ ]] || continue
              echo "echo \"PROBE:$ASSETS_DIR/$rel\""
              echo "quote MDTM $ASSETS_DIR/$rel"
            done
            echo "quit"
          } > "$PROBE_SCRIPT"

          OUT=$(timeout 420 lftp -f "$PROBE_SCRIPT" 2>&1)
          rm -f "$PROBE_SCRIPT"

          # Pair each PROBE: line with the following 213/550 reply; 14-digit UTC
          # timestamps compare correctly as plain strings against the 14-digit cutoff.
          PAIRED=$(awk '
            /^PROBE:/ { file=substr($0, 7); next }
            file != "" {
              if ($1 == "213" && $2 ~ /^[0-9]{14}$/) print $2, file
              file=""
            }' <<< "$OUT")
          if [ -z "$PAIRED" ]; then
            echo "::error::Asset prune: no MDTM replies from $ASSETS_DIR (server may not support RFC 3659 MDTM) - leaving cleanup to the next deploy."
            exit 0
          fi

          OLD=$(sort -n <<< "$PAIRED" | awk -v cutoff="$CUTOFF" '$1 < cutoff {print $2}' | head -1000)
          COUNT=$(echo "$OLD" | grep -c . || true)
          if [ "$COUNT" -eq 0 ]; then echo "Asset prune: nothing older than $DAYS days in $ASSETS_DIR."; exit 0; fi

          DEL_SCRIPT=$(mktemp)
          {
            echo "open -u $FTP_USER,$FTP_PASS ftp://$FTP_HOST"
            echo "$SETTINGS"
            # lftp rm does NOT glob-expand - hashed names are passed verbatim.
            # $OLD already holds full remote paths (the PROBE: values).
            echo "$OLD" | while IFS= read -r f; do echo "rm $f"; done
            echo "quit"
          } > "$DEL_SCRIPT"
          DEL_OUT=$(timeout 300 lftp -f "$DEL_SCRIPT" 2>&1)
          rm -f "$DEL_SCRIPT"
          echo "$DEL_OUT"
          echo "Asset prune: deleted $COUNT file(s) older than $DAYS days from $ASSETS_DIR."
          exit 0

  # ===========================================================================
  # FULL GAUNTLET — runs on the nightly schedule AND on prod promotion, NOT on push.
  # These jobs are the un-skippable PRODUCTION gates: the prod `deploy` job
  # `needs` them, so prod cannot ship unless every one is green. They test
  # against the LIVE staging site/DB (which the push above already deployed).
  # ===========================================================================
  # 2. Integration tests against the staging Supabase DB.
  gate-integration:
    # ---------------------------------------------------------------------------
    # SINGLE WRITER FOR THE ONE STAGING SITE (added 2026-09-09, board row
    # a-production-release-test-can-be-failed-by-an-unrelated).
    #
    # The workflow-level `concurrency:` above deliberately puts pushes and promotions in
    # DIFFERENT groups, and each half of that is right on its own: a mid-flight FTP mirror to
    # PRODUCTION must never be cancelled, and a burst of pushes only needs the newest staged.
    # Together they mean a promotion and a push can run AT THE SAME TIME on the same ref - and
    # then `deploy-staging` is FTP-mirroring new files over the staging site while the release
    # gates are driving a browser against exactly that site. A release test then fails on a
    # half-uploaded site with nothing wrong with the release at all. Measured on ReplyFlow
    # 2026-09-02: dispatch 33627614494 (12:00:54Z) overlapped push 33627544651 (12:00:13Z) on
    # the same commit; the health check passed against the OLD staging still up, then a page
    # navigation timed out on all three attempts inside the FTP replacement window. The same
    # gate had passed twice that day with no deploy in flight.
    #
    # This is a JOB-level group, not a change to the workflow-level one, and that is the point:
    # it serialises only the jobs that touch the staging site, so pushes still cancel each other
    # and promotions still refuse to be cancelled. cancel-in-progress MUST stay false -
    # cancelling either half is the failure this exists to prevent, not the remedy.
    #
    # Proven on ReplyFlow first; this is the same change on the rest of the fleet, which the
    # 2026-09-02 finding named explicitly as sharing the shape.
    # ---------------------------------------------------------------------------
    concurrency:
      group: staging-site-${{ github.ref }}
      cancel-in-progress: false
    if: github.event_name != 'push'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
        # No `cache: npm` on this runner — see the "NPM CACHE" note in deploy.yml.
      - run: npm ci
      - name: Integration tests (staging Supabase)
        run: npx vitest run tests/integration/critical-paths.test.ts
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          # Test reads process.env.STAGING_SUPABASE_ANON_KEY (was misnamed STAGING_ANON_KEY,
          # previously masked by the hardcoded fallback).
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}

  # 3. Run Playwright E2E against the deployed staging site — the gate that protects prod
  gate-e2e:
    # ---------------------------------------------------------------------------
    # SINGLE WRITER FOR THE ONE STAGING SITE (added 2026-09-09, board row
    # a-production-release-test-can-be-failed-by-an-unrelated).
    #
    # The workflow-level `concurrency:` above deliberately puts pushes and promotions in
    # DIFFERENT groups, and each half of that is right on its own: a mid-flight FTP mirror to
    # PRODUCTION must never be cancelled, and a burst of pushes only needs the newest staged.
    # Together they mean a promotion and a push can run AT THE SAME TIME on the same ref - and
    # then `deploy-staging` is FTP-mirroring new files over the staging site while the release
    # gates are driving a browser against exactly that site. A release test then fails on a
    # half-uploaded site with nothing wrong with the release at all. Measured on ReplyFlow
    # 2026-09-02: dispatch 33627614494 (12:00:54Z) overlapped push 33627544651 (12:00:13Z) on
    # the same commit; the health check passed against the OLD staging still up, then a page
    # navigation timed out on all three attempts inside the FTP replacement window. The same
    # gate had passed twice that day with no deploy in flight.
    #
    # This is a JOB-level group, not a change to the workflow-level one, and that is the point:
    # it serialises only the jobs that touch the staging site, so pushes still cancel each other
    # and promotions still refuse to be cancelled. cancel-in-progress MUST stay false -
    # cancelling either half is the failure this exists to prevent, not the remedy.
    #
    # Proven on ReplyFlow first; this is the same change on the rest of the fleet, which the
    # 2026-09-02 finding named explicitly as sharing the shape.
    # ---------------------------------------------------------------------------
    concurrency:
      group: staging-site-${{ github.ref }}
      cancel-in-progress: false
    # SERIALIZED behind gate-integration on purpose: both jobs use the ONE staging
    # database. gate-integration writes rows that move the number the app computes
    # (a 400 CHF Beitrag, a 1250.50 bootkonto Ausgabe, both summed by
    # src/hooks/useKontoberechnung.ts), and gate-e2e loads /finanzen and /dashboard.
    # Run in parallel, either gate can fail on the other gate's in-flight rows, which
    # is a failure that says nothing about the commit being promoted.
    # `!cancelled()` keeps the E2E signal even when integration goes red, so one bad
    # run still reports both gates rather than hiding one behind the other. Prod stays
    # blocked either way: the deploy job needs gate-integration as well.
    needs: gate-integration
    if: ${{ !cancelled() && github.event_name != 'push' }}
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      # Ubuntu 26.04 (what our self-hosted runners came up on, 2026-08-25) has no Playwright
      # browser build: `npx playwright install chromium` dies with "Playwright does not
      # support chromium on ubuntu26.04-x64". No newer Playwright fixes this - it is already
      # current - so this is Playwright's own documented escape hatch, and it selects exactly
      # the fallback Playwright itself applies to any distro it does not recognise.
      # Must be JOB-level, not on the install step: the browser cache path is keyed by host
      # platform, so install and the test run have to resolve the same key or the run will
      # not find what install downloaded. The "-x64" suffix is required; a bare "ubuntu24.04"
      # is rejected the same way. Harmless on GitHub-hosted runners, which resolve to it anyway.
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
        # No `cache: npm` on this runner — see the "NPM CACHE" note in deploy.yml.
      - run: npm ci
      - name: Cache Playwright browsers
        # Skipped on the persistent self-hosted runner: ~/.cache/ms-playwright already
        # survives there, so the save post-step is a multi-minute upload that buys nothing
        # and can blow the job timeout. See the "NPM CACHE" note in deploy.yml.
        if: runner.environment != 'self-hosted'
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # No cache-hit guard. On GitHub's throwaway machines, skipping the install on a cache hit
      # is a safe optimisation. On a persistent self-hosted runner it is a correctness bug: the
      # cache reports a hit while ~/.cache/ms-playwright holds a DIFFERENT browser build, the
      # install is skipped, and every test dies with "Executable doesn't exist". Observed
      # 2026-08-24 on run 32745305595: host had chromium-1208, this repo needs 1223.
      # `playwright install` is idempotent and returns in seconds when the build is present.
      - name: Install Playwright browsers
        run: |
          # --with-deps shells out to `sudo apt-get` to install OS libraries. On our self-hosted
          # runner the runner user's sudo is deliberately limited (01-provision-wsl.sh step 4),
          # because a job that can sudo freely can take the machine it runs on - and these jobs
          # execute repo code. The OS libraries are installed ONCE on the host instead, so here
          # we only need the browser binaries, which need no root at all.
          # GitHub-hosted runners are throwaway boxes with no such provisioning, so they keep
          # --with-deps. This matters: clearing RUNNER_LABEL sends every job back to them, and
          # that fallback has to actually work.
          if [ "${{ runner.environment }}" = "self-hosted" ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Verify staging is alive (catches .htaccess errors)
        run: |
          # Retry loop survives transient curl failures (exit 23 etc.), not just non-200s.
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u "${{ secrets.STAGING_HTPASSWD_USER }}:${{ secrets.STAGING_HTPASSWD_PASS }}" https://staging.boatbuddy.predivo.ch --max-time 30 || echo 000)
            if [ "$STATUS" = "200" ]; then echo "Staging health check passed (HTTP $STATUS, attempt $i)"; exit 0; fi
            echo "::warning::Staging check attempt $i/6 got HTTP $STATUS - retrying in 15s..."
            sleep 15
          done
          echo "::error::Staging returned HTTP $STATUS after 6 attempts - likely .htaccess error. Blocking production deploy."
          exit 1

      - name: Run staging E2E tests
        run: npm run test:e2e:staging
        env:
          STAGING_URL: https://staging.boatbuddy.predivo.ch
          STAGING_HTPASSWD_USER: ${{ secrets.STAGING_HTPASSWD_USER }}
          STAGING_HTPASSWD_PASS: ${{ secrets.STAGING_HTPASSWD_PASS }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-e2e-results
          path: playwright-report/

  # ===========================================================================
  # 4. PRODUCTION — only on a manual run with the typed "deploy" confirmation.
  #    Push-to-main never reaches this job (staging only) — see `on:` above.
  #    Gated behind the full gauntlet (needs: gate-integration + gate-e2e) so prod
  #    cannot ship unless integration AND E2E are green for the promoted commit.
  #    Intentionally does NOT `needs` the staging-deploy chain — staging already ran
  #    on the push being promoted; re-running it re-exposed prod to transient
  #    staging/Supabase/FTP failures. Instead the first step GATES on the recorded
  #    staging result for this exact commit.
  # ===========================================================================
  # ===========================================================================
  # SECURITY GATE (G3, deploy-standard §4d) — blocks prod promotion. gitleaks
  # full-history secret scan + `npm audit --audit-level=high`. AI
  # security-review stays advisory. Fleet retrofit 2026-08-15 (clean at high).
  # ===========================================================================
  gate-security:
    if: github.event_name != 'push'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
      - name: 'Secret scan: working tree (BLOCKING - new committed-file leaks)'
        run: /tmp/gitleaks dir . --no-banner --redact -v --exit-code 1
      - name: 'Secret scan: full history (AUDIT only, non-blocking - historical secrets rotated-dead 2026-07-07, deliberate no-scrub)'
        run: /tmp/gitleaks git . --no-banner --redact --log-opts=--all --exit-code 0 || true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Dependency audit (blocking at high)
        run: npm audit --audit-level=high
      # SAST — code-level security (fleet-hardening Wave 2, proven route from project-starter).
      # A different layer than npm audit (deps) + gitleaks (secrets in git): semgrep reads OUR
      # code for injection / XSS / hardcoded secrets. `.semgrepignore` excludes test/dev files
      # (example tokens + fixtures = false positives). --severity=ERROR = highest confidence;
      # --error fails the gate on a real finding.
      # Installed into the runner user's OWN home (~/.local), never system-wide. Since these
      # jobs moved onto our own machine the system Python is externally managed, so a bare
      # `pip install` dies with PEP 668 "externally-managed-environment" and the whole security
      # gate cannot start, which blocks every production promotion. It installed NOTHING and
      # scanned NOTHING before failing, so this repo had a security gate that never ran, from
      # the runner move on 2026-08-24 until this fix. A virtualenv is the textbook alternative
      # but that runner has no python3-venv and installing it needs root we do not hold.
      # `--user` writes only to the invoking user's site-packages, so --break-system-packages
      # here cannot touch the system Python. Verified on the runner host: installs clean as
      # user `roger`, semgrep 1.174.0. Same shape as signalscore, which has been green on our
      # own runner since 2026-08-25 (run 32810003771).
      - name: SAST scan (semgrep)
        run: |
          python3 -m pip install --quiet --user --break-system-packages semgrep
          # ~/.local/bin must be ON PATH, not just addressed directly: the `semgrep`
          # launcher execs a sibling `pysemgrep` and dies with
          # "Unix_error: No such file or directory execvp pysemgrep" if it cannot find it.
          export PATH="$HOME/.local/bin:$PATH"
          semgrep scan --config=p/security-audit --config=p/secrets --severity=ERROR --error --metrics=off .

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'deploy'
    needs: [gate-integration, gate-e2e, gate-security]
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify FTP credentials (fail fast on a stale secret)
        # A stale FTP secret used to surface late and confusingly. The site-id guard
        # tests `[ -n "$REMOTE_ID" ]`, and a 530 leaves REMOTE_ID empty - so the guard
        # printed "guard passed (remote='')" at the exact moment auth broke, and the run
        # only failed later inside the mirror, after up to 4 retries. This logs in once,
        # up front, and names the failure. curl exit 67 == FTP login denied; curl needs
        # no lftp, so this can run before checkout. (Added 2026-08-23 after the whole
        # fleet's FTP_PASS went stale at once.)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          set +e
          # --insecure mirrors `set ssl:verify-certificate no`, which every lftp call in
          # this fleet already uses: the Metanet cert is issued for tertia.sui-inter.net,
          # not for the FTP_HOST value, so verification fails with curl exit 60. The
          # control channel is still TLS; only name verification is skipped.
          # One slow answer from a busy FTP server is not a bad password. Retry the
          # transport, never the credential: curl 67 ("Access denied: 530") is final,
          # because a wrong password does not become right on attempt two. Added after
          # 15 simultaneous fleet deploys made this step time out at 30s (curl 28).
          n=0
          while :; do
            OUT=$(curl -sS --ssl-reqd --insecure --connect-timeout 20 --max-time 90 --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/" 2>&1)
            RC=$?
            if [ "$RC" -eq 0 ] || [ "$RC" -eq 67 ]; then break; fi
            n=$((n+1))
            if [ "$n" -ge 3 ]; then break; fi
            echo "FTP pre-flight attempt $n failed (curl exit $RC) - retrying in $((n*10))s"
            sleep $((n*10))
          done
          set -e
          if [ "$RC" -eq 67 ]; then
            echo "::error::FTP login denied (530) for $FTP_USER@$FTP_HOST - the FTP password secret is stale. Nothing was deployed."
            exit 1
          fi
          if [ "$RC" -ne 0 ]; then
            echo "::error::FTP connection failed (curl exit $RC) for $FTP_USER@$FTP_HOST. Nothing was deployed."
            printf '%s\n' "$OUT" | head -5
            exit 1
          fi
          echo "FTP auth OK - $(printf '%s\n' "$OUT" | grep -c '') entries at the account root."

      - name: Verify staging gate (this commit passed staging + E2E on push)
        # curl + grep only. No `gh`, no `jq`. This repo's jobs run on our own machines, where
        # `gh` is not on the runner service's PATH: it was installed after the runner was
        # configured, so the service's cached PATH predates it, and passwordless sudo is
        # deliberately absent so the service cannot be restarted to pick it up. The gate died
        # with "gh: command not found" (exit 127), which meant NO production promotion could
        # pass at all - a gate cannot say yes if it cannot run. Same fix as BackOffice and
        # Cockpit (2026-08-25): a deploy gate must not depend on a tool that happens to be on
        # the host. curl is everywhere, and the REST API needs nothing but the token in scope.
        # The gate's MEANING is unchanged: a green staging run for this exact commit, or else
        # the docs/chore-only fallback against the last staged commit.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          SHA="${{ github.sha }}"
          API="https://api.github.com/repos/$GH_REPO"
          # A failed request returns empty, never a false "yes": every check below is
          # fail-closed, so a network problem blocks the promotion instead of waving it through.
          # -f makes curl fail (empty output, non-zero) on any non-2xx, so a 406/403/429 error
          # BODY can never reach a grep/awk parser as if it were content. Combined with `|| true`
          # this keeps the "failed request returns empty" contract above literally true.
          api() { curl -fsS -m 30 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: $2" "$1" || true; }
          json() { api "$1" 'application/vnd.github+json'; }

          echo "Checking for a green staging run of commit $SHA ..."
          # head_sha= filters server-side, so a "success" anywhere in this payload can only
          # belong to THIS commit's own run. That is what makes reading it without jq safe -
          # nothing has to be paired up by position.
          OK=$(json "$API/actions/workflows/deploy.yml/runs?branch=main&event=push&head_sha=$SHA&per_page=50" \
                 | grep -c '"conclusion": *"success"' || true)
          if [ "${OK:-0}" -lt 1 ]; then
            echo "HEAD $SHA has no direct staging run; checking if only docs/chore changed since a recently staged commit ..."
            SAFE='^(docs/|.*\.md$|README|LICENSE|\.gitignore$|\.gitleaks\.toml$|\.gitleaksignore$)'
            # The refuse path USED TO download a full compare diff per base (application/vnd.github.diff,
            # each capped at the 30s curl timeout) for ~100 bases, so a genuine refusal could exceed the
            # 20-min job timeout and surface to the operator as "timed out" instead of its real reason.
            # Two changes make refusal cheap WITHOUT weakening the gate (verdict is unchanged):
            #   1. ONE JSON compare per base yields BOTH the top-level ahead/identical status AND the
            #      changed files (files[].filename / .previous_filename) - no separate full-diff download.
            #   2. A hard cap on bases walked: bases come newest-first, so the legitimate docs-only case
            #      (a docs commit pushed right after a staged app commit) resolves in the first iteration.
            #      If none of the most recent MAX_BASES staged commits match, we REFUSE explicitly
            #      (fail-closed) with a message that says so - never silently, never past the timeout.
            MAX_BASES=30
            PROMOTABLE=0
            # status=success returns ONLY green runs, so every head_sha here is by definition a commit
            # that passed staging - and newest-first, so the common case resolves immediately.
            BASES=$(json "$API/actions/workflows/deploy.yml/runs?branch=main&event=push&status=success&per_page=100" \
                      | grep -o '"head_sha": *"[0-9a-f]\{40\}"' | awk -F'"' '{print $4}')
            i=0
            for BASE in $BASES; do
              i=$((i+1))
              if [ "$i" -gt "$MAX_BASES" ]; then
                echo "::error::Commit $SHA has no staging run and still differs in app files from each of the $MAX_BASES most recently staged commits. Push to main, let staging go green, then promote."
                exit 1
              fi
              # ONE JSON compare gives the top-level status AND the file list. The first "status" in a
              # compare payload is the top-level one; the per-file "status" values live later inside
              # .files, so head -1 is the compare status. A failed request yields empty (curl -f), so a
              # 406/403/429 body can never be parsed as content.
              CMP=$(json "$API/compare/$BASE...$SHA")
              STATUS=$(printf '%s' "$CMP" | grep -o '"status": *"[a-z]*"' | head -1 | awk -F'"' '{print $4}')
              case "${STATUS:-}" in ahead|identical) ;; *) continue ;; esac
              # Real JSON keys are "filename":/"previous_filename": (clean quotes); the same strings
              # appearing INSIDE a patch body are backslash-escaped (\"filename\":) and do NOT match, so
              # diff content cannot spoof a path. Both sides of a rename are read, so a rename cannot
              # slip an app file past this on either name.
              FILES=$(printf '%s' "$CMP" \
                        | grep -oE '"(filename|previous_filename)": *"[^"]*"' | awk -F'"' '{print $4}' | sort -u)
              # Fail-CLOSED on a truncated/empty payload: an 'ahead' compare ALWAYS lists at least one
              # changed file, so no filenames means the request failed (an oversized-compare 406, a
              # rate-limit body, a timeout). Reading that as "nothing changed" would promote untested
              # code off a transient API blip, so skip this base. 'identical' is the one legitimately
              # empty compare, so it is exempt.
              case "$STATUS" in
                ahead) [ -z "$FILES" ] && continue ;;
              esac
              NONDOC=$(printf '%s' "$FILES" | grep -vE "$SAFE" || true)
              if [ -z "$NONDOC" ]; then echo "Only docs/chore changed since staged commit $BASE (status=$STATUS); app tree matches a staged state. Promoting."; PROMOTABLE=1; break; fi
            done
            if [ "$PROMOTABLE" -ne 1 ]; then
              echo "::error::Commit $SHA has no staging run and changes app files since the last staged commit. Push to main, let staging go green, then promote."
              exit 1
            fi
          fi
          echo "Staging gate passed - commit $SHA has a green staging run. Promoting to production."

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
        # No `cache: npm` on this runner — see the "NPM CACHE" note in deploy.yml.
      - run: npm ci

      - name: Build for production
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GATE_PASSWORD_HASH: ${{ secrets.VITE_GATE_PASSWORD_HASH }}

      # Same control as staging: the mirror below uploads ./dist/ wholesale to the live
      # site, so the upload refuses instead of merely happening to be safe.
      - name: Guard - nothing credential-shaped may reach the FTP upload
        run: node scripts/guard-credential-files.mjs --dir dist

      - name: Deploy via FTP (zero-downtime)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          sudo apt-get install -y lftp
          LFTP_SETTINGS="set ftp:ssl-force yes; set ssl:verify-certificate no; set ftp:ssl-protect-data no; set ftp:passive-mode yes; set ftp:prefer-epsv no; set net:timeout 30; set net:max-retries 4; set net:persist-retries 4; set net:reconnect-interval-base 8; set mirror:parallel-transfer-count 4;"
          echo "boatbuddy" > ./dist/.site-id

          # Site-id guard — never deploy to the wrong target.
          REMOTE_ID=$(timeout 90 lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "$LFTP_SETTINGS cat boatbuddy.predivo.ch/.site-id; bye" 2>/dev/null | tr -d '[:space:]') || REMOTE_ID=""
          # An EMPTY id is not a match failure, so `-n` below let it through - which is exactly
          # what a 530, a timeout or a dropped connection produces. The guard cannot tell those
          # apart from "file absent", so it must not deploy blind. Every live target has a seeded
          # .site-id (all 13 verified reading non-empty on 2026-08-23); a genuinely new target must
          # have its .site-id seeded first. Copied in spirit from Valrano, which had this right.
          if [ -z "$REMOTE_ID" ]; then
            echo "::error::Site-id guard INCONCLUSIVE: read no .site-id (timeout, dropped connection, bad credential or missing file - indistinguishable). Refusing to deploy blind."
            exit 1
          fi
          if [ -n "$REMOTE_ID" ] && [ "$REMOTE_ID" != "boatbuddy" ]; then
            echo "::error::DEPLOY ABORTED — remote .site-id is '$REMOTE_ID', expected 'boatbuddy'. Wrong FTP target!"
            exit 1
          fi
          echo "Site-id guard passed (remote='${REMOTE_ID:-<none>}')"

          # Zero-downtime: assets first (no delete), then full mirror with delete. Retry loop.
          # The delete pass EXCLUDES '^assets/': a tab still running an OLD index.html lazily
          # fetches the OLD hashed chunks, and deleting them at deploy time turns that into
          # "Failed to fetch dynamically imported module". Old chunks are pruned by AGE
          # (14 days) in the step below — long after every open tab has reloaded.
          CMDS="$LFTP_SETTINGS mirror --reverse --no-perms --verbose ./dist/assets/ boatbuddy.predivo.ch/assets/; mirror --reverse --delete --no-perms --verbose --exclude '^assets/' ./dist/ boatbuddy.predivo.ch/; bye"
          n=0
          until [ $n -ge 4 ]; do
            if timeout 420 lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "$CMDS"; then
              echo "Production FTP deploy succeeded (attempt $((n+1)))"; exit 0
            fi
            n=$((n + 1)); echo "::warning::Production FTP attempt $n failed (transient FTPS data-channel failure — runner-side; Metanet FTP verified reachable); retrying in 25s..."; sleep 25
          done
          echo "::error::Production FTP deploy failed after 4 attempts"; exit 1

      - name: Apply DB migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/apply-migrations.mjs --project-ref xzythvxmuxmczuiophwp

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Deploy edge functions to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Retry-with-backoff for transient Supabase API 502s.
          FNS=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d -not -name '_*' -printf '%f ')
          n=0
          until [ $n -ge 4 ]; do
            if supabase functions deploy $FNS --project-ref xzythvxmuxmczuiophwp --use-api; then
              echo "Edge functions deployed to production (attempt $((n+1)))"; exit 0
            fi
            n=$((n + 1)); echo "::warning::Supabase functions-deploy attempt $n failed (transient API error, e.g. 502); backing off 60s..."; sleep 60
          done
          echo "::error::Edge functions deploy to production failed after 4 attempts"; exit 1

      - name: Post-deploy production smoke test
        run: |
          # Confirm prod actually serves after the promotion (catches a broken build
          # that FTP'd cleanly but renders a 5xx). Retry to ride out CDN warm-up.
          for i in 1 2 3 4; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://boatbuddy.predivo.ch || echo 000)
            if [ "$STATUS" = "200" ]; then echo "Production smoke passed (HTTP $STATUS, attempt $i)"; exit 0; fi
            echo "::warning::prod smoke attempt $i got HTTP $STATUS — retrying in 15s"; sleep 15
          done
          echo "::error::Production smoke FAILED — boatbuddy.predivo.ch not serving 200"; exit 1

      - name: Prune stale assets (14-day retention)
        # Age-based cleanup of the hashed chunks the asset-retention exclusion above
        # leaves behind. Replaces the old behavior where the deploy-time --delete pass
        # removed every superseded chunk the moment a deploy landed — a tab still running
        # the previous index.html then got "Failed to fetch dynamically imported module"
        # on its next lazy navigation. Old chunks are now kept 14 days and pruned by age.
        # lftp has no find -mtime, so this probes each file's mtime over raw FTP MDTM
        # (RFC 3659) and deletes files older than 14 days. Same step shape as the staging
        # job; see there for the full rationale (never fails the deploy; cap 1000/run).
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          ASSETS_DIR: boatbuddy.predivo.ch/assets
        run: |
          # GitHub wraps every run block in bash -e: a failing command substitution in an
          # assignment (e.g. LIST=$(lftp ...)) would abort the whole step BEFORE the script's
          # own rc guards run. Cleanup must never abort mid-run — disable -e first.
          set +e
          set -u
          export TZ=UTC
          DAYS=14
          CUTOFF=$(date -u -d "$DAYS days ago" +%Y%m%d%H%M%S)
          SETTINGS="set ftp:ssl-force yes
          set ssl:verify-certificate no; set ftp:ssl-protect-data no
          set ftp:passive-mode yes; set net:timeout 60"

          LIST=$(timeout 180 lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<SCRIPT 2>&1
          $SETTINGS
          find $ASSETS_DIR
          quit
          SCRIPT
          )
          if [ $? -ne 0 ]; then
            echo "::error::Asset prune: listing $ASSETS_DIR failed - leaving cleanup to the next deploy. Output: $(echo "$LIST" | head -3)"
            exit 0
          fi
          if [ -z "$(echo "$LIST" | tr -d '[:space:]')" ]; then
            echo "Asset prune: $ASSETS_DIR is empty - nothing to do."
            exit 0
          fi

          # Probe every file's mtime in ONE lftp session: echo a PROBE: name line before
          # each quote MDTM so reply lines stay paired with their file even when a file
          # vanishes (550) between listing and probing.
          PROBE_SCRIPT=$(mktemp)
          {
            echo "open -u $FTP_USER,$FTP_PASS ftp://$FTP_HOST"
            echo "$SETTINGS"
            # find prints full remote paths ("$ASSETS_DIR/<nested>/file", recursively);
            # normalize to a path relative to ASSETS_DIR so either output format is safe.
            echo "$LIST" | while IFS= read -r p; do
              p="${p%$'\r'}"
              [ "$p" = "$ASSETS_DIR" ] && continue
              rel="${p#"$ASSETS_DIR"/}"
              # Hashed asset names only ([A-Za-z0-9._/-], no spaces/globs) — anything
              # else is skipped, never deleted.
              [[ "$rel" =~ ^[A-Za-z0-9._/-]+$ ]] || continue
              echo "echo \"PROBE:$ASSETS_DIR/$rel\""
              echo "quote MDTM $ASSETS_DIR/$rel"
            done
            echo "quit"
          } > "$PROBE_SCRIPT"

          OUT=$(timeout 420 lftp -f "$PROBE_SCRIPT" 2>&1)
          rm -f "$PROBE_SCRIPT"

          # Pair each PROBE: line with the following 213/550 reply; 14-digit UTC
          # timestamps compare correctly as plain strings against the 14-digit cutoff.
          PAIRED=$(awk '
            /^PROBE:/ { file=substr($0, 7); next }
            file != "" {
              if ($1 == "213" && $2 ~ /^[0-9]{14}$/) print $2, file
              file=""
            }' <<< "$OUT")
          if [ -z "$PAIRED" ]; then
            echo "::error::Asset prune: no MDTM replies from $ASSETS_DIR (server may not support RFC 3659 MDTM) - leaving cleanup to the next deploy."
            exit 0
          fi

          OLD=$(sort -n <<< "$PAIRED" | awk -v cutoff="$CUTOFF" '$1 < cutoff {print $2}' | head -1000)
          COUNT=$(echo "$OLD" | grep -c . || true)
          if [ "$COUNT" -eq 0 ]; then echo "Asset prune: nothing older than $DAYS days in $ASSETS_DIR."; exit 0; fi

          DEL_SCRIPT=$(mktemp)
          {
            echo "open -u $FTP_USER,$FTP_PASS ftp://$FTP_HOST"
            echo "$SETTINGS"
            # lftp rm does NOT glob-expand - hashed names are passed verbatim.
            # $OLD already holds full remote paths (the PROBE: values).
            echo "$OLD" | while IFS= read -r f; do echo "rm $f"; done
            echo "quit"
          } > "$DEL_SCRIPT"
          DEL_OUT=$(timeout 300 lftp -f "$DEL_SCRIPT" 2>&1)
          rm -f "$DEL_SCRIPT"
          echo "$DEL_OUT"
          echo "Asset prune: deleted $COUNT file(s) older than $DAYS days from $ASSETS_DIR."
          exit 0
