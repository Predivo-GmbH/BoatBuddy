name: Deploy

# ─────────────────────────────────────────────────────────────────────────────
# TIERED PIPELINE (2026-07-15) — "gates guard prod, not every staging push".
#
# The old shape ran the FULL gauntlet (validate -> deploy-staging -> E2E) on
# EVERY push to main, so a one-line content change took ~15 min. Industry
# standard (DORA): deploy often, keep the per-push pipeline fast, and run the
# heavy acceptance suite as a RELEASE gate + nightly — not on every push.
#
#   push -> main        FAST staging deploy: lint + unit + build + FTP + edge
#                       fns + alive-smoke. ~5-6 min.  (job: deploy-staging)
#   schedule (nightly)  FULL gauntlet against live staging — daily regression
#                       signal even with no promotion.  (jobs: gate-*)
#   workflow_dispatch   PROD promotion. Gated behind the FULL gauntlet
#     confirm=deploy    (integration + E2E) THEN deploys prod.  (gate-* -> deploy)
#
# Nothing was weakened for PRODUCTION: prod still cannot ship unless the staging
# integration suite and the staging E2E suite are both green for the promoted
# commit. What changed is WHEN they run — release-time + nightly instead of on
# every trivial staging push.
# ─────────────────────────────────────────────────────────────────────────────

on:
  # Push to main runs the fast staging deploy ONLY. Production is NOT deployed
  # automatically — it requires an explicit manual run (workflow_dispatch) so we
  # always review the gates before going live ("ask before production").
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  schedule:
    # Nightly full gauntlet against whatever is currently live on staging.
    - cron: '35 4 * * *'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deployment (runs staging + E2E first)'
        required: true
        default: ''

concurrency:
  # Production promotions (workflow_dispatch) keep their own serialized, NEVER-cancelled
  # group: cancelling a mid-flight FTP mirror can leave prod half-uploaded.
  # Pushes (the staging pipeline) get a per-ref group that DOES cancel — when several
  # commits land in a row only the newest needs a staging deploy + E2E.
  group: ${{ github.event_name == 'workflow_dispatch' && 'deploy-production' || format('staging-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # ===========================================================================
  # 1. FAST STAGING DEPLOY — every push. One job, one checkout, one npm ci,
  #    build once. lint + unit tests are the per-push gates (the test pyramid's
  #    fast base): a change that lints, typechecks (tsc in build), and passes
  #    unit tests cannot white-screen the site. The heavy integration / E2E
  #    suites run on the nightly + prod-promotion gauntlet below, NOT here.
  # ===========================================================================
  deploy-staging:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --run --passWithNoTests
        env:
          # `npm test` (vitest run) also picks up tests/integration/critical-paths.test.ts
          # (vitest.config excludes only e2e/**), which builds a Supabase client at beforeAll.
          # Since c7152aa6 dropped the hardcoded staging-anon fallback, the key must come from
          # the env here too or createClient() throws "supabaseKey is required."
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}

      - name: Build for staging
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}
          VITE_GATE_PASSWORD_HASH: ${{ secrets.VITE_GATE_PASSWORD_HASH }}
          VITE_EXTRACT_SECRET: ${{ secrets.EXTRACT_SECRET_SHARED }}

      - name: Prepare staging .htaccess (real prod config + Basic auth + noindex)
        run: |
          # Start from the REAL production .htaccess (from the build) so staging catches
          # any Apache syntax error BEFORE it can reach production.
          mv dist/.htaccess /tmp/prod.htaccess
          {
            echo 'AuthType Basic'
            echo 'AuthName "Staging"'
            echo 'AuthUserFile /var/www/vhosts/predivo.ch/staging.boatbuddy.predivo.ch/.htpasswd'
            echo 'Require valid-user'
            echo ''
            cat /tmp/prod.htaccess
            echo ''
            echo '# --- Staging overrides: never index staging ---'
            echo '<IfModule mod_headers.c>'
            echo '  Header always set X-Robots-Tag "noindex, nofollow"'
            echo '</IfModule>'
          } > dist/.htaccess

      - name: Deploy staging via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          sudo apt-get install -y lftp
          echo "boatbuddy-staging" > ./dist/.site-id
          # Resilient FTPS for Metanet: force PASV, single data connection, retry loop.
          # Exclude .htpasswd so the mirror's --delete never removes the auth file.
          CMDS="set ftp:ssl-force yes; set ssl:verify-certificate no; set ftp:ssl-protect-data no; set ftp:passive-mode yes; set ftp:prefer-epsv no; set net:timeout 30; set net:max-retries 4; set net:persist-retries 4; set net:reconnect-interval-base 8; set mirror:parallel-transfer-count 4; mirror --reverse --delete --no-perms --verbose --exclude .htpasswd --exclude cgi-bin/ ./dist/ staging.boatbuddy.predivo.ch/; bye"
          n=0
          until [ $n -ge 4 ]; do
            if lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "$CMDS"; then
              echo "Staging FTP deploy succeeded (attempt $((n+1)))"; exit 0
            fi
            n=$((n + 1)); echo "::warning::Staging FTP attempt $n failed (transient FTPS data-channel failure — runner-side; Metanet FTP verified reachable); retrying in 25s..."; sleep 25
          done
          echo "::error::Staging FTP deploy failed after 4 attempts"; exit 1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Deploy edge functions to staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Retry-with-backoff for transient Supabase API 502s.
          FNS=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d -not -name '_*' -printf '%f ')
          n=0
          until [ $n -ge 4 ]; do
            if supabase functions deploy $FNS --project-ref svpewgbwousyheohlrtt --use-api; then
              echo "Edge functions deployed to staging (attempt $((n+1)))"; exit 0
            fi
            n=$((n + 1)); echo "::warning::Supabase functions-deploy attempt $n failed (transient API error, e.g. 502); backing off 60s..."; sleep 60
          done
          echo "::error::Edge functions deploy to staging failed after 4 attempts"; exit 1

      - name: Verify staging is alive (catches .htaccess errors)
        run: |
          # Retry loop survives transient curl failures (exit 23 etc.), not just non-200s.
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u "${{ secrets.STAGING_HTPASSWD_USER }}:${{ secrets.STAGING_HTPASSWD_PASS }}" https://staging.boatbuddy.predivo.ch --max-time 30 || echo 000)
            if [ "$STATUS" = "200" ]; then echo "Staging health check passed (HTTP $STATUS, attempt $i)"; exit 0; fi
            echo "::warning::Staging check attempt $i/6 got HTTP $STATUS - retrying in 15s..."
            sleep 15
          done
          echo "::error::Staging returned HTTP $STATUS after 6 attempts - likely .htaccess error. Blocking production deploy."
          exit 1

  # ===========================================================================
  # FULL GAUNTLET — runs on the nightly schedule AND on prod promotion, NOT on push.
  # These jobs are the un-skippable PRODUCTION gates: the prod `deploy` job
  # `needs` them, so prod cannot ship unless every one is green. They test
  # against the LIVE staging site/DB (which the push above already deployed).
  # ===========================================================================
  # 2. Integration tests against the staging Supabase DB.
  gate-integration:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Integration tests (staging Supabase)
        run: npx vitest run tests/integration/critical-paths.test.ts
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          # Test reads process.env.STAGING_SUPABASE_ANON_KEY (was misnamed STAGING_ANON_KEY,
          # previously masked by the hardcoded fallback).
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}

  # 3. Run Playwright E2E against the deployed staging site — the gate that protects prod
  gate-e2e:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Verify staging is alive (catches .htaccess errors)
        run: |
          # Retry loop survives transient curl failures (exit 23 etc.), not just non-200s.
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u "${{ secrets.STAGING_HTPASSWD_USER }}:${{ secrets.STAGING_HTPASSWD_PASS }}" https://staging.boatbuddy.predivo.ch --max-time 30 || echo 000)
            if [ "$STATUS" = "200" ]; then echo "Staging health check passed (HTTP $STATUS, attempt $i)"; exit 0; fi
            echo "::warning::Staging check attempt $i/6 got HTTP $STATUS - retrying in 15s..."
            sleep 15
          done
          echo "::error::Staging returned HTTP $STATUS after 6 attempts - likely .htaccess error. Blocking production deploy."
          exit 1

      - name: Run staging E2E tests
        run: npm run test:e2e:staging
        env:
          STAGING_URL: https://staging.boatbuddy.predivo.ch
          STAGING_HTPASSWD_USER: ${{ secrets.STAGING_HTPASSWD_USER }}
          STAGING_HTPASSWD_PASS: ${{ secrets.STAGING_HTPASSWD_PASS }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-e2e-results
          path: playwright-report/

  # ===========================================================================
  # 4. PRODUCTION — only on a manual run with the typed "deploy" confirmation.
  #    Push-to-main never reaches this job (staging only) — see `on:` above.
  #    Gated behind the full gauntlet (needs: gate-integration + gate-e2e) so prod
  #    cannot ship unless integration AND E2E are green for the promoted commit.
  #    Intentionally does NOT `needs` the staging-deploy chain — staging already ran
  #    on the push being promoted; re-running it re-exposed prod to transient
  #    staging/Supabase/FTP failures. Instead the first step GATES on the recorded
  #    staging result for this exact commit.
  # ===========================================================================
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'deploy'
    needs: [gate-integration, gate-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify staging gate (this commit passed staging + E2E on push)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          SHA="${{ github.sha }}"
          echo "Checking for a green staging run of commit $SHA ..."
          OK=$(gh run list --workflow deploy.yml --branch main --event push --limit 50 \
                 --json headSha,conclusion \
                 --jq "[.[] | select(.headSha==\"$SHA\" and .conclusion==\"success\")] | length")
          if [ "${OK:-0}" -lt 1 ]; then
            echo "::error::Commit $SHA has no successful staging run. Push to main, wait for staging to go green, then promote. (Emergency bypass: fast_deploy lane if present.)"
            exit 1
          fi
          echo "Staging gate passed — commit $SHA has a green staging run. Promoting to production."

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build for production
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GATE_PASSWORD_HASH: ${{ secrets.VITE_GATE_PASSWORD_HASH }}
          VITE_EXTRACT_SECRET: ${{ secrets.EXTRACT_SECRET_SHARED }}

      - name: Deploy via FTP (zero-downtime)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          sudo apt-get install -y lftp
          LFTP_SETTINGS="set ftp:ssl-force yes; set ssl:verify-certificate no; set ftp:ssl-protect-data no; set ftp:passive-mode yes; set ftp:prefer-epsv no; set net:timeout 30; set net:max-retries 4; set net:persist-retries 4; set net:reconnect-interval-base 8; set mirror:parallel-transfer-count 4;"
          echo "boatbuddy" > ./dist/.site-id

          # Site-id guard — never deploy to the wrong target.
          REMOTE_ID=$(lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "$LFTP_SETTINGS cat boatbuddy.predivo.ch/.site-id; bye" 2>/dev/null | tr -d '[:space:]') || REMOTE_ID=""
          if [ -n "$REMOTE_ID" ] && [ "$REMOTE_ID" != "boatbuddy" ]; then
            echo "::error::DEPLOY ABORTED — remote .site-id is '$REMOTE_ID', expected 'boatbuddy'. Wrong FTP target!"
            exit 1
          fi
          echo "Site-id guard passed (remote='${REMOTE_ID:-<none>}')"

          # Zero-downtime: assets first (no delete), then full mirror with delete. Retry loop.
          CMDS="$LFTP_SETTINGS mirror --reverse --no-perms --verbose ./dist/assets/ boatbuddy.predivo.ch/assets/; mirror --reverse --delete --no-perms --verbose ./dist/ boatbuddy.predivo.ch/; bye"
          n=0
          until [ $n -ge 4 ]; do
            if lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "$CMDS"; then
              echo "Production FTP deploy succeeded (attempt $((n+1)))"; exit 0
            fi
            n=$((n + 1)); echo "::warning::Production FTP attempt $n failed (transient FTPS data-channel failure — runner-side; Metanet FTP verified reachable); retrying in 25s..."; sleep 25
          done
          echo "::error::Production FTP deploy failed after 4 attempts"; exit 1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Deploy edge functions to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Retry-with-backoff for transient Supabase API 502s.
          FNS=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d -not -name '_*' -printf '%f ')
          n=0
          until [ $n -ge 4 ]; do
            if supabase functions deploy $FNS --project-ref xzythvxmuxmczuiophwp --use-api; then
              echo "Edge functions deployed to production (attempt $((n+1)))"; exit 0
            fi
            n=$((n + 1)); echo "::warning::Supabase functions-deploy attempt $n failed (transient API error, e.g. 502); backing off 60s..."; sleep 60
          done
          echo "::error::Edge functions deploy to production failed after 4 attempts"; exit 1

      - name: Post-deploy production smoke test
        run: |
          # Confirm prod actually serves after the promotion (catches a broken build
          # that FTP'd cleanly but renders a 5xx). Retry to ride out CDN warm-up.
          for i in 1 2 3 4; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://boatbuddy.predivo.ch || echo 000)
            if [ "$STATUS" = "200" ]; then echo "Production smoke passed (HTTP $STATUS, attempt $i)"; exit 0; fi
            echo "::warning::prod smoke attempt $i got HTTP $STATUS — retrying in 15s"; sleep 15
          done
          echo "::error::Production smoke FAILED — boatbuddy.predivo.ch not serving 200"; exit 1
