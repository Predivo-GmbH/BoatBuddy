name: Critical Path Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]

# Collapse superseded runs: when several pushes land in a row only the
# newest commit needs testing. Safe here — these jobs never write to prod.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Needed by npm ci: .npmrc points @predivo-gmbh at GitHub Packages.
  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

jobs:
  critical-path:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # No cache-hit guard. On GitHub's throwaway machines, skipping the install on a cache hit
      # is a safe optimisation. On a persistent self-hosted runner it is a correctness bug: the
      # cache reports a hit while ~/.cache/ms-playwright holds a DIFFERENT browser build, the
      # install is skipped, and every test dies with "Executable doesn't exist". Observed
      # 2026-08-24 on run 32745305595: host had chromium-1208, this repo needs 1223.
      # `playwright install` is idempotent and returns in seconds when the build is present.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run integration tests (staging Supabase)
        run: npx vitest run tests/integration/critical-paths.test.ts
        env:
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}

      - name: Run critical path tests
        run: npx playwright test e2e/critical-path.spec.ts

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: critical-path-results
          path: playwright-report/
