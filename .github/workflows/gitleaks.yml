name: Secret Scan (gitleaks)

# Blocks secrets from entering the repo. On PRs it scans the PR commits; on
# pushes it scans the pushed commits. Free for user-owned repos (no license).
# Anon/publishable Supabase keys are public by design (RLS-protected) — if a
# scan flags one, add it to .gitleaksignore with a comment, don't hide a real secret.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks-action lists PR commits via the API on pull_request events;
  # without this it 403s with "Resource not accessible by integration".
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The action above scans the COMMIT RANGE of the event, and that is not enough.
      # Proven 2026-08-20 on ReplyFlow: a merge commit introduced a service_role JWT and
      # this workflow reported "No leaks detected". A working-tree scan sees the file as
      # it now stands regardless of how it got there (same form deploy.yml uses).
      # --config is passed ONLY when the repo actually has a .gitleaks.toml: gitleaks
      # exits non-zero on a config path that does not exist, which would fail the step
      # for the wrong reason and look exactly like a leak.
      - name: gitleaks (working tree)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          CFG=""
          if [ -f .gitleaks.toml ]; then CFG="--config .gitleaks.toml"; fi
          /tmp/gitleaks dir . --no-banner --redact --exit-code 1 $CFG

  # gitleaks scans CONTENT for secret-shaped VALUES. It cannot see a credentials file
  # that is correctly ignored today and one `git add -f` (or one deleted .gitignore
  # line) away from being committed tomorrow - which is exactly what happened here on
  # 2026-08-30, when a rotation left docs/Credentials.txt.bak-2026-08-30-before-mailbox-pw
  # untracked and matched by nothing in .gitignore. This job scans NAMES instead, and
  # asserts the ignore rules still bite on a case-sensitive runner.
  credential-files:
    name: No credential-shaped file is committable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Guard - no credential-shaped file is committable
        run: node scripts/guard-credential-files.mjs
      - name: Prove the guard refuses a decoy of the same shape
        run: node --test scripts/guard-credential-files.test.mjs
